name: "Lecture locale (llama.cpp, modèle ouvert, sans clé)"

on:
  workflow_dispatch:

concurrency:
  group: lecteur-local
  cancel-in-progress: false

permissions:
  contents: write

env:
  MODELE_URL: "https://huggingface.co/bartowski/Qwen2.5-7B-Instruct-GGUF/resolve/main/Qwen2.5-7B-Instruct-Q4_K_M.gguf"
  MODELE: "Qwen2.5-7B-Instruct-Q4_K_M.gguf"

jobs:
  lire:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install httpx==0.28.1
      - name: Modèle (cache)
        uses: actions/cache@v4
        with:
          path: modeles
          key: modele-${{ env.MODELE }}
      - name: Télécharger le modèle si absent
        run: |
          mkdir -p modeles
          [ -f "modeles/$MODELE" ] || curl -sSL -o "modeles/$MODELE" "$MODELE_URL"
          ls -lh modeles
      - name: llama.cpp (binaire officiel, sinon compilation)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # la « dernière » version peut être une version de nuit sans binaires (passage 44938590179) : on parcourt
          # les versions récentes et on prend la première qui publie le binaire Linux x64 pour processeur
          mkdir -p llama
          for T in $(gh release list --repo ggml-org/llama.cpp --limit 20 --json tagName --jq '.[].tagName'); do
            A=$(gh release view "$T" --repo ggml-org/llama.cpp --json assets --jq '.assets[].name' \
                | grep -i "ubuntu" | grep -i "x64" | grep -viE "vulkan|cuda|rocm|hip|sycl|arm|s390|openvino|kleidi" | head -1)
            if [ -n "$A" ]; then echo "version $T : $A"; gh release download "$T" --repo ggml-org/llama.cpp --pattern "$A" -D llama; break; fi
          done
          cd llama
          for f in *; do (unzip -q "$f" 2>/dev/null || tar xzf "$f" 2>/dev/null) || true; done
          if [ -z "$(find . -name llama-server -type f)" ]; then
            echo "aucun binaire trouvé : compilation depuis les sources"
            git clone -q --depth 1 https://github.com/ggml-org/llama.cpp src
            cmake -S src -B build -DLLAMA_CURL=OFF -DGGML_NATIVE=ON > /dev/null
            cmake --build build --config Release -j 4 --target llama-server > /dev/null
          fi
          find . -name "llama-server" -type f
      - name: Démarrer le serveur
        run: |
          SRV=$(find llama -name llama-server -type f | head -1)
          chmod +x "$SRV"
          export LD_LIBRARY_PATH="$(dirname "$SRV"):$LD_LIBRARY_PATH"   # bibliothèques livrées à côté du binaire
          nohup "$SRV" -m "modeles/$MODELE" --port 8080 -c 8192 -t 4 > serveur.log 2>&1 &
          for i in $(seq 1 120); do curl -sf http://127.0.0.1:8080/health && break; sleep 5; done
          tail -5 serveur.log
          curl -sf http://127.0.0.1:8080/health || { cat serveur.log | tail -40; exit 1; }
      - name: Lire
        run: python -u lire.py
      - name: Journal du serveur (vitesse)
        if: always()
        run: grep -E "eval time|prompt eval" serveur.log | tail -6 || true
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "lecteur-local"
          git config user.email "lecteur-local@users.noreply.github.com"
          git add resultats/*.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "résultats du $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase || true
            git push
          fi
